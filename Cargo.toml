[workspace]
resolver = "2"
members = ["crates/opencast-core", "src-tauri"]
# `cargo test` at the root runs the portable core only; the Tauri shell
# needs the platform webview SDK and is built with `npm run tauri dev|build`.
default-members = ["crates/opencast-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/your-name/opencast"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
