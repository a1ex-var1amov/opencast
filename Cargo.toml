[workspace]
resolver = "2"
members = ["crates/opencast-core", "crates/opencast-ffi"]
# `cargo test` at the root runs the portable core only.
default-members = ["crates/opencast-core"]

[workspace.package]
version = "0.2.4"
edition = "2021"
license = "MIT"
# Placeholder until the repo is public — no crate inherits it today.
repository = "https://github.com/your-name/opencast"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# No `strip`: the Rust output is a static library; build-app.command strips
# the final app binary instead.
