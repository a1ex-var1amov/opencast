name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test
      - run: cargo clippy -p opencast-core -- -D warnings

  ffi:
    name: FFI tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p opencast-ffi -- -D warnings
      - run: cargo test -p opencast-ffi --lib
      # Typecheck 14 / 15 / Tahoe 26 / 27 + panel logic tests (Xcode toolchain).
      - run: ./check-macos-targets.command
      # The dmg ships both slices, so the Intel one has to compile too.
      - run: rustup target add x86_64-apple-darwin
      - run: ./packaging/build-arch.zsh x86_64 build-ci-x86.log target/ci-slice-x86_64/OpenCast
