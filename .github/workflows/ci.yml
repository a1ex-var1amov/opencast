name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p opencast-core
      - run: cargo clippy -p opencast-core -- -D warnings

  app:
    name: App build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run tauri build -- --bundles app
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCast.app
          path: target/release/bundle/macos/
