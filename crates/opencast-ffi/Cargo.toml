[package]
name = "opencast-ffi"
description = "macOS C ABI in front of the OpenCast engine"
version.workspace = true
edition.workspace = true
license.workspace = true
# This app's internals, not a library for others to take.
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1"
arboard = "3"
opencast-core = { path = "../opencast-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "process", "signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
global-hotkey = "0.8"
