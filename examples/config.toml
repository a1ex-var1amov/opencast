# ---------------------------------------------------------------------------
# Command overrides: tweak any command — apps and builtins included.
#   match   command id or title (case-insensitive)
#   alias   short name; an exact alias match ranks first ("sl" → Slack)
#   icon    emoji or an SF Symbol name ("safari", "terminal.fill")
#   title   rename · boost adds to the score (negative demotes) · hidden removes it
# ---------------------------------------------------------------------------

