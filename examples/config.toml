# ---------------------------------------------------------------------------
# AI commands. Placeholders:
#   {selection}  text selected in the frontmost app (needs Accessibility permission)
#   {input}      text you type after picking the command
# provider/model are optional and default to the default provider.
# ---------------------------------------------------------------------------

[[ai_commands]]
id = "fix-grammar"
title = "Fix Spelling and Grammar"
icon = "✍️"
keywords = ["proofread", "spelling"]
system = "You are a careful copy editor. Return only the corrected text, no commentary."
prompt = "Fix spelling and grammar, keep the tone and formatting:\n\n{selection}"

[[ai_commands]]
id = "explain"
title = "Explain This"
icon = "💡"
prompt = "Explain the following clearly and briefly:\n\n{selection}"

[[ai_commands]]
id = "summarize"
title = "Summarize Selection"
icon = "📝"
prompt = "Summarize in 3-5 bullet points:\n\n{selection}"

[[ai_commands]]
id = "improve"
title = "Improve Writing"
icon = "✨"
keywords = ["rewrite", "polish", "edit"]
system = "You improve prose. Return only the improved text, no commentary."
prompt = "Improve clarity and flow, keep the meaning and language:\n\n{selection}"

[[ai_commands]]
id = "translate"
title = "Translate to English"
icon = "🌐"
keywords = ["translation", "english"]
system = "You are a translator. Return only the English translation, no commentary."
prompt = "Translate to English:\n\n{selection}"

[[ai_commands]]
id = "shell"
title = "Shell Command For…"
icon = "⌨️"
keywords = ["bash", "zsh", "terminal"]
system = "Reply with a single shell command for macOS zsh and one short line explaining it."
prompt = "{input}"

# ---------------------------------------------------------------------------
# Global hotkeys: bind any command to a key, Superkey-style.
# `command` is a command title (case-insensitive) or id — an app, a window
# action, an AI command, a script, a quicklink, a layout.
# Window actions (Rectangle-style, all searchable in the launcher too):
#   Left Half, Right Half, Top Half, Bottom Half, Top/Bottom Left/Right
#   Quarter, First/Center/Last Third, Maximize, Center
# No window hotkeys ship enabled, so nothing clashes with Rectangle if you
# still run it. The "Use Caps Lock as Launcher Key" script remaps Caps Lock
# to F18; after running it you can set hotkey = "F18" in [general].
# ---------------------------------------------------------------------------

