# ---------------------------------------------------------------------------
# AI commands. Placeholders:
#   {selection}  text selected in the frontmost app (needs Accessibility permission)
#   {input}      text you type after picking the command
#   {clipboard}  current clipboard text
#   {app}        name of the frontmost app
# provider/model are optional and default to the default provider.
# temperature / max_tokens override the provider's.
# output = "chat" (default) | "replace" (stream, then paste over the selection)
#        | "paste" (paste into the front app) | "copy" (clipboard + toast)
# ---------------------------------------------------------------------------

# AI presets: a chat with its own model, prompt and MCP tools, shown as a command.
# [[ai_presets]]
# id = "reviewer"
# title = "Code Reviewer"
# provider = "anthropic"
# model = "claude-sonnet-5-5"
# system = "You review diffs. Be terse."
# tools = ["github__*"]         # globs over server__tool; [] = no tools
# profile = false               # leave profile.md out of this chat

[[ai_commands]]
id = "fix-grammar"
title = "Fix Spelling and Grammar"
icon = "✍️"
keywords = ["proofread", "spelling"]
system = "You are a careful copy editor. Return only the corrected text, no commentary."
prompt = "Fix spelling and grammar, keep the tone and formatting:\n\n{selection}"
temperature = 0.2
output = "replace"              # fixes the text in place; set to "chat" to review first

[[ai_commands]]
id = "explain"
title = "Explain This"
icon = "💡"
prompt = "Explain the following clearly and briefly:\n\n{selection}"

[[ai_commands]]
id = "summarize"
title = "Summarize Selection"
icon = "📝"
prompt = "Summarize in 3-5 bullet points:\n\n{selection}"

[[ai_commands]]
id = "improve"
title = "Improve Writing"
icon = "✨"
keywords = ["rewrite", "polish", "edit"]
system = "You improve prose. Return only the improved text, no commentary."
prompt = "Improve clarity and flow, keep the meaning and language:\n\n{selection}"

[[ai_commands]]
id = "translate"
title = "Translate to English"
icon = "🌐"
keywords = ["translation", "english"]
system = "You are a translator. Return only the English translation, no commentary."
prompt = "Translate to English:\n\n{selection}"

[[ai_commands]]
id = "shell"
title = "Shell Command For…"
icon = "⌨️"
keywords = ["bash", "zsh", "terminal"]
system = "Reply with a single shell command for macOS zsh and one short line explaining it."
prompt = "{input}"

# ---------------------------------------------------------------------------
# Global hotkeys: bind any command to a key, Superkey-style.
# `command` is a command title (case-insensitive) or id — an app, a window
# action, an AI command, a script, a quicklink, a layout.
# Window actions (Rectangle-style, all searchable in the launcher too):
#   Left/Right/Top/Bottom/Center/Middle Half, the four Quarters, First/Center/Last
#   Third, Top/Middle/Bottom Third, First/Last/Top/Bottom Two Thirds, the Sixths
#   (incl. Middle Left/Right Sixth), Maximize, Almost Maximize,
#   Maximize Height/Width, Center, Reasonable Size, Make Larger/Smaller,
#   Move Left/Right/Up/Down, Next/Previous Display, Display 1-3, Full Screen,
#   Exit Full Screen, Toggle Fullscreen, Restore Window Size, Undo Window Action.
#   "Arrange Window" shows them all as a grid with a live preview.
#   Spaces too: Next/Previous Space, Move Window to Next/Previous Space, and
#   "Switch Space", which lists every desktop and what runs on it.
# The keys come from `window_hotkeys` above ("rectangle" here). Set it to "off"
# if you still run Rectangle, Magnet or Hammerspoon — two apps registering the
# same keys means only one of them gets the press. The "Use Caps Lock as Launcher
# Key" script remaps Caps Lock to F18; after running it you can set
# hotkey = "F18" in [general].
# ---------------------------------------------------------------------------

# Your own window positions, searchable and bindable like the built-ins.
