# OpenCast configuration
# Location: ~/.config/opencast/config.toml  (override with $OPENCAST_CONFIG_DIR)
# Run "Reload Commands" from the launcher after editing.

[general]
hotkey = "Alt+Space"            # e.g. "Cmd+Space", "Ctrl+Alt+K"
hyperkey = false                # Caps Lock = ⌃⌥⌘⇧ while held, opens the launcher when tapped (restart to apply)
theme = "system"                # system | light | dark  (Accent color always follows the Mac)
presentation = "island"         # island (top bar) | spotlight (centered)
default_provider = "ollama"     # id of a provider below; first one is used if unset
# scripts_dir = "~/.config/opencast/scripts"
script_timeout_secs = 30
script_login_shell = true       # run scripts via `$SHELL -lc` so Homebrew/nvm/pyenv are on PATH
# theme_file = "themes/mine.toml"   # colours, radius, sizes — see examples/themes/
# What to show when a query has fewer than fallback_threshold strong hits, in order.
# Entries: command ids/titles, "quicklinks" (every {query} quicklink), "files" (Spotlight).
fallbacks = ["quicklinks", "files"]
fallback_threshold = 3
shortcuts = true                # list your Shortcuts.app shortcuts as commands
snippet_expansion = true        # type a snippet keyword like ;sig in any app to expand it
calendar = true                 # next meeting at the top of the launcher (asks for Calendar access)
check_updates = false           # weekly check of GitHub releases (off: no traffic you did not configure)
currency = false                # `100 usd to eur`: fetches exchange rates daily when on
update_repo = ""                # "owner/repo" for Check for Updates
confirm_destructive = true      # ask before Restart, Shut Down, Log Out, Quit All Apps
shift_quick_look = false        # a lone Shift tap previews the selected row
emoji_skin_tone = ""            # light | medium-light | medium | medium-dark | dark
universal_actions_hotkey = "Hyper+Space"   # Act on Selection: actions for selected text, links or files
ai_profile = true               # add profile.md (Edit AI Profile) to AI chats; ⌘⇧R in chat remembers a line
translate_to = "English"        # `tr hola`, Translate (selection); text already in it goes to translate_alt
# translate_alt = "Spanish"
# sync_dir = "~/Dropbox/opencast" # "Sync Config" target instead of iCloud Drive
# include = ["~/team/opencast-shared.toml", "git:https://github.com/org/opencast-shared"]
# Window management
window_gap = 0                  # points between snapped windows (and between a window and the screen edge)
screen_margin = 0               # extra inset from every screen edge
window_cycle = "sizes"          # repeat a half: sizes (1/2 → 2/3 → 1/3) | displays (move to the next screen) | off
window_portrait = "auto"        # rotated monitor: first/center/last thirds, two thirds, center half stack top-to-bottom | off
almost_maximize = 0.9           # size of Almost Maximize, as a fraction of the screen
window_hud = true               # brief "Left Half" HUD when a hotkey moves a window
drag_snap = false               # drag a window to an edge/corner to snap (⌥ = thirds); off when macOS tiling is on

# Window keys to install. "rectangle" is the set Rectangle uses: ⌃⌥ + arrows for
# the halves, U I J K for the corners, D E F T G for the thirds, ⌃⌥⌅ to maximize,
# ⌃⌥⌫ to put a window back, ⌃⌥= / ⌃⌥- bigger and smaller, ⌃⌥⌘ + arrows for
# displays. "spectacle" is the ⌥⌘ set Rectangle registers out of the box (and
# Spectacle used). Keys you bind yourself always win over a preset entry, so
# rebind one in the Window tab and only that one changes.
# Use "off" if Rectangle, Magnet or Hammerspoon is still running — two apps
# grabbing the same keys means whoever registers first wins.
# Names combine with a comma: "rectangle, spaces" adds ⌃⌥⇧ + arrows for the
# Mission Control spaces (move the view, or the window, left and right).
window_hotkeys = "rectangle"

# In-panel keys. Mods: Cmd, Shift, Alt/Option, Ctrl. Keys: a character, or
# Tab, Return, Escape, Space, Up, Down, Left, Right, Backspace, Delete, F1-F20.
[keys]
ask_ai = "Tab"
click_text = "`"
actions = "Cmd+K"
pin = "Cmd+Shift+P"
paste_answer = "Cmd+Return"
copy_answer = "Cmd+Shift+C"
new_chat = "Cmd+N"
next = "Ctrl+N"
previous = "Ctrl+P"
dictate = "Cmd+D"               # on-device dictation into the field
quick_look = "Cmd+Y"
preview = "Cmd+I"               # show / hide the preview pane
large_type = "Cmd+L"            # show the typed text or answer huge on screen

# ---------------------------------------------------------------------------
# AI providers. Three wire formats cover everything:
#   kind = "openai"     any OpenAI-compatible /chat/completions endpoint
#                       (OpenAI, Ollama, LM Studio, OpenRouter, Groq, vLLM, LiteLLM...)
#   kind = "anthropic"  Anthropic Messages API
#   kind = "gemini"     Google Gemini API
#
# Keys never live in this file. Use one of:
#   api_key_env = "OPENAI_API_KEY"    env var (only works if the app inherits it)
#   api_key_cmd = "security find-generic-password -s opencast-openai -w"
#                                     any command that prints the key: macOS Keychain,
#                                     1Password (`op read op://...`), pass, etc.
# Store a key in the macOS Keychain once with:
#   security add-generic-password -s opencast-openai -a "$USER" -w 'sk-...'
#
# `model` is the default; `models` adds choices to the chat model picker.
# Model ids change often: use any id your account or server actually serves.
# ---------------------------------------------------------------------------

# Attachments (screenshots, files) go to the model as pixels when it can see
# them; otherwise OpenCast reads the text out of them on-device (Vision OCR) and
# sends that, which works with any model. Unset = guessed from the model name
# (gpt-4o, gpt-4.1, claude…, gemini…, …-vl, pixtral… = yes). Force it:
#   vision = true    send images even when the name looks text-only
#   vision = false   always OCR, never send pixels

[[providers]]
id = "ollama"
kind = "openai"
base_url = "http://localhost:11434/v1"   # no key needed for local servers
model = "llama3.2"

