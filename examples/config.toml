# ---------------------------------------------------------------------------
# Quicklinks. {query} turns the link into one that asks for input.
# ---------------------------------------------------------------------------

[[quicklinks]]
title = "Search GitHub"
url = "https://github.com/search?q={query}"
icon = "🐙"
keywords = ["gh", "code"]

[[quicklinks]]
title = "Search Kagi"
url = "https://kagi.com/search?q={query}"
icon = "🔎"

# ---------------------------------------------------------------------------
# MCP servers (Model Context Protocol). Their tools become launcher commands
# and tools the AI chat can call (it asks before running any tool you have
# not listed in auto_approve). Secrets come from commands, never this file.
#   command/args      stdio server (npx, uvx, docker run -i …)
#   url               Streamable HTTP server
#   env / env_cmd     environment; env_cmd values are commands that print it
#   tools             only these tools ("get_*" prefix allowed); empty = all
#   in_launcher       list tools as commands (default true)
#   in_chat           offer tools to the AI chat (default true)
#   auto_approve      tools the AI may run without asking, e.g. ["get_*", "list_*"]
# Servers that also advertise resources or prompt templates get commands for
# those too: Return reads a resource into the panel; a prompt opens a chat with
# the server's own wording, unsent, so you can edit it first.
# Run "Refresh MCP Tools" after editing.
# ---------------------------------------------------------------------------

# [[mcp_servers]]
# id = "github"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-github"]
# env_cmd = { GITHUB_PERSONAL_ACCESS_TOKEN = "security find-generic-password -s opencast-github -w" }
# auto_approve = ["get_*", "list_*", "search_*"]

# [[mcp_servers]]
# id = "fs"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/Users/you/Documents"]
# in_launcher = false

# ---------------------------------------------------------------------------
# Snippets. Search by keyword; Return pastes into the frontmost app.
# Keywords that start with a symbol (;sig, ::date) also expand as you type in
# any app (snippet_expansion above). Set auto_expand = false/true to override.
# Placeholders: {date} {time} {datetime} {clipboard} {cursor}
# ---------------------------------------------------------------------------

[[snippets]]
keyword = ";sig"
name = "Email signature"
text = """
Best,
Alex
"""
keywords = ["signature", "email"]

[[snippets]]
keyword = ";date"
name = "Today's date"
text = "{date}"

[[snippets]]
keyword = "shrug"
name = "Shrug"
text = "¯\\_(ツ)_/¯"

# ---------------------------------------------------------------------------
# Focus sessions: "Start Focus" hides these apps (and hides them again if they
# come back) for `minutes`, or the minutes you type, and closes browser tabs on
# `domains` (Safari and Chrome-family; subdomains count). "Pause / Resume
# Focus" lifts the blocks and freezes the clock; "Stop Focus" ends early.
# ---------------------------------------------------------------------------

[focus]
apps = ["Slack", "Messages", "Mail", "Discord", "Telegram", "WhatsApp"]
minutes = 25
domains = ["x.com", "twitter.com", "reddit.com", "facebook.com", "instagram.com", "tiktok.com", "news.ycombinator.com"]
menu_bar = true                 # countdown in the menu bar while a session runs

# ---------------------------------------------------------------------------
# Pipelines: text through several steps, shown as one command.
# input: selection (default) | clipboard | query (asks) | none
# steps: ai:<ai command id> · prompt:<text with {input}> · script:<path or title>
#        shell:<command, text on stdin> · transform:<name> (trim, upper, lower,
#        title, sort-lines, unique-lines, reverse-lines, remove-empty-lines,
#        join-lines, url-encode, url-decode, base64-encode, base64-decode,
#        json-format, json-minify, slug, count, strip-markdown)
# output: show (default) | copy | paste | replace
# ---------------------------------------------------------------------------

